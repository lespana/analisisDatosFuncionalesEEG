name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # No se instalan MNE ni PyTorch: la CI no descarga EEG ni entrena modelos.
      - name: Instalar el paquete y nbformat
        run: pip install -e ".[dev]"
      - name: Validar cuadernos
        run: python scripts/validate_notebooks.py
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -v
